<title>Fluxo de Caixa VJ Cosméticos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<style>
:root { --bg: #f4f7f1; --card: #ffffff; --ink: #1d2618; --muted: #5d6a57; --line: #e0e7da; --brand: #2f4a25; --gold: #7ed348; --neg: #c2362f; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1510; --card: #172117; --ink: #e8f0e3; --muted: #a3b39a; --line: #2a3a27; --neg: #ff7b70; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink);
  font-family: "Archivo", "Segoe UI", system-ui, sans-serif; font-size: 14px; }
main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
form { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--gold);
  border-radius: 12px; padding: 0 0 24px; overflow: hidden; display: flex; flex-direction: column; gap: 14px; }
.topo { background: #fff; border-bottom: 4px solid var(--brand); padding: 18px 0 14px; display: flex; justify-content: center; }
.topo img { height: 92px; }
footer .b2 { background: #fff; border-radius: 6px; padding: 3px 7px; display: inline-flex; vertical-align: middle; margin-left: 6px; }
footer .b2 img { height: 16px; }
h1 { margin: 6px 28px 0; font: 600 20px/1.3 "Sora", "Segoe UI", sans-serif; text-align: center; text-wrap: balance; }
.sub { margin: -6px 28px 4px; text-align: center; color: var(--muted); font-size: 13px; }
label { margin: 0 28px; font-size: 13px; color: var(--muted); font-weight: 600; display: flex; flex-direction: column; gap: 6px; }
input { font: inherit; font-size: 15px; font-weight: 400; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--ink); }
input:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; border-color: var(--brand); }
button { all: unset; cursor: pointer; margin: 4px 28px 0; text-align: center; padding: 11px; border-radius: 8px;
  background: var(--brand); color: #fff; font-weight: 600; font-size: 15px; }
button:hover { filter: brightness(1.15); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button:disabled { opacity: .7; cursor: wait; }
.erro { margin: 0 28px; min-height: 18px; color: var(--neg); font-size: 13px; text-align: center; }
footer { padding: 14px 16px 18px; color: var(--muted); font-size: 12.5px; display: flex; justify-content: space-between; gap: 8px;
  flex-wrap: wrap; max-width: 960px; width: 100%; margin: 0 auto; border-top: 1px solid var(--line); }
footer b { color: var(--ink); font-weight: 600; }
</style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const CHAVE_SESSAO = "fc-chave-" + CIFRA.s;  // a chave fica só nesta aba; fechar a aba pede o login de novo
async function chaveDe(login, senha) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(login.trim().toLowerCase() + "\n" + senha), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(CIFRA.s), iterations: CIFRA.n, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function abrir(chave) {
  const t = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(CIFRA.i) }, chave, b64(CIFRA.c));
  const html = new TextDecoder().decode(t);
  document.open(); document.write(html); document.close();
}
(async () => {
  const erro = document.getElementById("lErro");
  if (!window.crypto || !crypto.subtle) { erro.textContent = "Este navegador não abre o painel protegido. Use Chrome, Edge ou Safari atualizados."; return; }
  try {
    const g = sessionStorage.getItem(CHAVE_SESSAO);
    if (g) { await abrir(await crypto.subtle.importKey("raw", b64(g), { name: "AES-GCM" }, true, ["decrypt"])); return; }
  } catch (e) {}
  const f = document.getElementById("fLogin"), bt = f.querySelector("button");
  document.getElementById("lUser").focus();
  f.addEventListener("submit", async ev => {
    ev.preventDefault();
    erro.textContent = ""; bt.disabled = true; bt.textContent = "Abrindo…";
    try {
      const k = await chaveDe(document.getElementById("lUser").value, document.getElementById("lSenha").value);
      const raw = new Uint8Array(await crypto.subtle.exportKey("raw", k));
      await abrir(k);
      try { sessionStorage.setItem(CHAVE_SESSAO, btoa(String.fromCharCode(...raw))); } catch (e) {}
    } catch (e) {
      erro.textContent = "Login ou senha incorretos."; bt.disabled = false; bt.textContent = "Entrar";
    }
  });
})();
